name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create app.properties
      run: |
        # Use secrets if available, otherwise use placeholder values for CI builds
        API_KEY="${{ secrets.NYC_OPENDATA_API_KEY }}"
        MAP_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}"
        chmod 600 app/app.properties

        # If secrets aren't configured, use placeholder values (app won't work but will compile)
        if [ -z "$API_KEY" ]; then
          API_KEY="CI_PLACEHOLDER_API_KEY"
        fi
        if [ -z "$MAP_KEY" ]; then
          MAP_KEY="CI_PLACEHOLDER_MAP_KEY"
        fi

        echo "api_key=$API_KEY" > app/app.properties
        echo "map_key=$MAP_KEY" >> app/app.properties

    - name: Create keystore.properties
      run: |
        echo "storeFile=debug.keystore" > keystore.properties
        echo "storePassword=android" >> keystore.properties
        echo "keyAlias=androiddebugkey" >> keystore.properties
        echo "keyPassword=android" >> keystore.properties

    - name: Run Lint
      run: ./gradlew lint

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Upload Lint Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: app/build/reports/lint-results-debug.html
        if-no-files-found: ignore

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: app/build/reports/tests/
        if-no-files-found: ignore
